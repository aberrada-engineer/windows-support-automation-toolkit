name: ESN-Toolkit CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  powershell-quality-gate:
    name: AST, PSScriptAnalyzer & Pester (PS 7 + PS 5.1)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Quality Gate on PowerShell 7+ (AST, Analyzer, Pester v5)
        shell: pwsh
        run: ./.github/scripts/Invoke-QualityGate.ps1 -RunAnalyzer

      - name: Quality Gate on Windows PowerShell 5.1 (AST, Pester v5)
        shell: powershell
        run: ./.github/scripts/Invoke-QualityGate.ps1
