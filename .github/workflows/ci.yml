name: ESN-Toolkit CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: PSScriptAnalyzer Lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning `
            -ExcludeRule PSAvoidUsingWriteHost,PSUseShouldProcessForStateChangingFunctions `
            -ErrorAction Stop

          if ($results) {
            $results | Format-Table -AutoSize
            $errors = $results | Where-Object Severity -eq Error
            if ($errors) {
              Write-Host "::error::$($errors.Count) erreur(s) PSScriptAnalyzer"
              exit 1
            }
            Write-Host "::warning::$($results.Count) avertissement(s) détecté(s)"
          } else {
            Write-Host "✅ Aucun problème PSScriptAnalyzer"
          }

  test:
    name: Pester Tests
    runs-on: windows-latest
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          Install-Module Pester -Force -Scope CurrentUser -MinimumVersion 5.0.0
          Import-Module Pester

      - name: Run Pester (Core + Helpers)
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path            = '.\Tests\ESN-Toolkit.Tests.ps1'
          $config.Filter.Tag          = @('Core','Network','Windows','AD','Migration')
          $config.Output.Verbosity    = 'Detailed'
          $config.TestResult.Enabled  = $true
          $config.TestResult.OutputPath = 'TestResults.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'

          $result = Invoke-Pester -Configuration $config
          if ($result.FailedCount -gt 0) {
            Write-Host "::error::$($result.FailedCount) test(s) Pester en échec"
            exit 1
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults.xml

  validate-structure:
    name: Validate Toolkit Structure
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        shell: pwsh
        run: |
          $required = @(
            "Invoke-IncidentAnalysis.ps1",
            "Invoke-Migration.ps1",
            "Core\ESN-Core.psm1",
            "Modules\Network\ESN-Network.psm1",
            "Modules\Windows\ESN-Windows.psm1",
            "Modules\AD\ESN-AD.psm1",
            "Modules\M365\ESN-M365.psm1",
            "Modules\Migration\ESN-Migration.psm1",
            "Tests\ESN-Toolkit.Tests.ps1",
            "README.md"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Host "::error::Fichiers manquants : $($missing -join ', ')"
            exit 1
          }
          Write-Host "✅ Structure du toolkit validée ($($required.Count) fichiers)"

      - name: Count scripts
        shell: pwsh
        run: |
          $count = (Get-ChildItem -Recurse -Filter "*.ps1","*.psm1" | Where-Object FullName -notlike "*node_modules*").Count
          Write-Host "📦 Total scripts : $count"
