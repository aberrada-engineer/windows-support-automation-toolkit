name: ESN-Toolkit CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate-pwsh:
    name: PowerShell 7+ (AST, Analyzer, Pester v5)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Quality Gate (pwsh)
        shell: pwsh
        run: ./.github/scripts/Invoke-QualityGate.ps1 -RunAnalyzer

  quality-gate-winps51:
    name: Windows PowerShell 5.1 (AST, Pester v5)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Quality Gate (powershell 5.1)
        shell: powershell
        run: ./.github/scripts/Invoke-QualityGate.ps1
